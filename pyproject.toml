[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmlink"
version = "0.4.0"
description = "Local-first multi-robot telemetry, tracking, coordination, and simulation core."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AeroFuse contributors"}]
keywords = ["robotics", "drone", "rover", "swarm", "telemetry", "tracking", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
swarmlink = "swarmlink.cli:main"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/alpha1238909/swarmlink"
Issues = "https://github.com/alpha1238909/swarmlink/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
